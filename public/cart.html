<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Lunia Foods</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <header class="site-header" id="site-header"></header>

  <main class="container page">
    <h1>Your cart</h1>
    <div id="cart"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const box = document.getElementById('cart');
      if (!cart.length) {
        box.innerHTML = '<p class="alert">Your cart is empty. <a href="shop.html">Browse products</a>.</p>';
        return;
      }
      const subtotal = cartSubtotal();
      box.innerHTML = `
        ${cart.map(it => `
          <div class="line">
            <div class="info">
              <div class="name">${it.name}</div>
              <div class="muted">${money(it.price)} / ${it.unit}</div>
            </div>
            <div class="qty">
              <button onclick="changeQuantity('${it.id}', -1)">−</button>
              <span>${it.quantity}</span>
              <button onclick="changeQuantity('${it.id}', 1)">+</button>
            </div>
            <div class="line-total">${money(it.price * it.quantity)}</div>
            <button class="add-btn" style="margin:0" onclick="removeFromCart('${it.id}')">Remove</button>
          </div>`).join('')}
        <div class="totals">
          <div class="row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          <div class="row"><span>Delivery</span><span>${money(49)}</span></div>
          <div class="row grand"><span>Total</span><span>${money(subtotal + 49)}</span></div>
        </div>
        <div style="margin-top:1.5rem; text-align:right;">
          <a class="btn" href="checkout.html">Proceed to checkout</a>
        </div>`;
    }
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
